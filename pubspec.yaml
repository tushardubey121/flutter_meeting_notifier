name: meeting_notifier
description: macOS fly-over alerts a few minutes before Google Calendar meetings.
publish_to: none
version: 1.0.0+1
homepage: https://github.com/tushardubey121/flutter_meeting_notifier
repository: https://github.com/tushardubey121/flutter_meeting_notifier
issue_tracker: https://github.com/tushardubey121/flutter_meeting_notifier/issues

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  google_sign_in: ^6.2.1
  googleapis: ^11.4.0
  http: ^1.2.0
  provider: ^6.1.2
  window_manager: ^0.3.8
  url_launcher: ^6.2.5
  intl: ^0.19.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/plane.json
