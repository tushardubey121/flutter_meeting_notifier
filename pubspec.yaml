name: meeting_notifier
description: Fly-over meeting notifier for Google Calendar
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # Google Auth & Calendar
  google_sign_in: ^6.2.1
  googleapis: ^11.4.0
  googleapis_auth: ^1.5.1
  http: ^1.2.0
  provider:

  # Window management (always-on-top overlay)
  window_manager: ^0.3.8

  # Screen dimensions for full-screen overlay
  screen_retriever: ^0.1.9

  # Menu bar (tray) icon so the app lives in the background
  tray_manager: ^0.2.3

  # Auto-start at login
  launch_at_startup: ^0.3.1

  # Open meeting links in browser
  url_launcher: ^6.2.5

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Time formatting
  intl: ^0.19.0

  # Lottie animation for the plane (assets/plane.json)
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
